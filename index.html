<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Procurement People Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>

:root {

  --bg: #0f1117;

  --bg2: #171b26;

  --bg3: #1e2333;

  --bg4: #252b3b;

  --border: #2a3048;

  --border2: #343d5c;

  --text: #e8ecf4;

  --text2: #a0a8c0;

  --text3: #606880;

  --accent: #3b82f6;

  --accent2: #2563eb;

  --accent-glow: rgba(59,130,246,0.15);

  --green: #22c55e;

  --green-bg: rgba(34,197,94,0.1);

  --yellow: #f59e0b;

  --yellow-bg: rgba(245,158,11,0.1);

  --red: #ef4444;

  --red-bg: rgba(239,68,68,0.1);

  --purple: #a78bfa;

  --purple-bg: rgba(167,139,250,0.1);

  --cyan: #22d3ee;

  --sidebar-w: 220px;

  --radius: 10px;

  --radius-sm: 6px;

  --shadow: 0 4px 24px rgba(0,0,0,0.4);

  --font: 'DM Sans', sans-serif;

  --mono: 'DM Mono', monospace;

  --transition: 0.18s ease;

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

::-webkit-scrollbar { width: 6px; height: 6px; }

::-webkit-scrollbar-track { background: var(--bg2); }

::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

 

/* Layout */

#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {

  width: var(--sidebar-w); min-width: var(--sidebar-w);

  background: var(--bg2); border-right: 1px solid var(--border);

  display: flex; flex-direction: column;

  overflow-y: auto; z-index: 10;

  transition: width var(--transition);

}

#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#topbar {

  height: 54px; min-height: 54px;

  background: var(--bg2); border-bottom: 1px solid var(--border);

  display: flex; align-items: center; padding: 0 24px; gap: 16px;

}

#content { flex: 1; overflow-y: auto; padding: 28px 28px 48px; }

 

/* Sidebar */

.sidebar-logo {

  padding: 20px 18px 14px;

  border-bottom: 1px solid var(--border);

  display: flex; align-items: center; gap: 10px;

}

.logo-icon {

  width: 32px; height: 32px; background: var(--accent);

  border-radius: 8px; display: flex; align-items: center; justify-content: center;

  font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;

  box-shadow: 0 0 16px var(--accent-glow);

}

.logo-text { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }

.logo-sub { font-size: 10px; color: var(--text3); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }

.nav-section { padding: 14px 10px 4px; }

.nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); font-weight: 600; padding: 0 8px; margin-bottom: 4px; }

.nav-item {

  display: flex; align-items: center; gap: 10px;

  padding: 9px 10px; border-radius: var(--radius-sm);

  cursor: pointer; transition: background var(--transition), color var(--transition);

  font-size: 13.5px; font-weight: 500; color: var(--text2);

  text-decoration: none; position: relative;

}

.nav-item:hover { background: var(--bg3); color: var(--text); }

.nav-item.active { background: var(--accent-glow); color: var(--accent); }

.nav-item.active .nav-icon { color: var(--accent); }

.nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: .8; }

.nav-badge {

  margin-left: auto; background: var(--red); color: #fff;

  font-size: 10px; font-weight: 700; border-radius: 99px;

  padding: 1px 6px; min-width: 18px; text-align: center;

}

.sidebar-footer { margin-top: auto; padding: 14px 12px; border-top: 1px solid var(--border); }

.sidebar-footer-btn {

  display: flex; align-items: center; gap: 8px;

  padding: 8px 10px; border-radius: var(--radius-sm);

  cursor: pointer; color: var(--text3); font-size: 12.5px;

  transition: all var(--transition);

}

.sidebar-footer-btn:hover { background: var(--bg3); color: var(--text2); }

 

/* Topbar */

.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text3); }

.breadcrumb-sep { opacity: .4; }

.breadcrumb-current { color: var(--text); font-weight: 500; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.topbar-chip {

  display: flex; align-items: center; gap: 6px;

  padding: 5px 12px; border-radius: 99px;

  background: var(--bg3); border: 1px solid var(--border);

  font-size: 12px; color: var(--text2); cursor: pointer;

  transition: all var(--transition);

}

.topbar-chip:hover { border-color: var(--accent); color: var(--accent); }

.topbar-chip svg { width: 14px; height: 14px; }

 

/* Buttons */

.btn {

  display: inline-flex; align-items: center; gap: 7px;

  padding: 8px 16px; border-radius: var(--radius-sm);

  font-family: var(--font); font-size: 13.5px; font-weight: 600;

  cursor: pointer; transition: all var(--transition); border: none; white-space: nowrap;

}

.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.btn-primary { background: var(--accent); color: #fff; }

.btn-primary:hover { background: var(--accent2); box-shadow: 0 0 16px var(--accent-glow); }

.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }

.btn-ghost:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid transparent; }

.btn-danger:hover { background: var(--red); color: #fff; }

.btn-success { background: var(--green-bg); color: var(--green); border: 1px solid transparent; }

.btn-success:hover { background: var(--green); color: #fff; }

.btn-sm { padding: 5px 11px; font-size: 12.5px; }

.btn-xs { padding: 3px 8px; font-size: 11.5px; }

 

/* Cards */

.card {

  background: var(--bg2); border: 1px solid var(--border);

  border-radius: var(--radius); padding: 20px;

  transition: border-color var(--transition);

}

.card:hover { border-color: var(--border2); }

.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }

 

/* KPI Cards */

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; margin-bottom: 24px; }

.kpi-card {

  background: var(--bg2); border: 1px solid var(--border);

  border-radius: var(--radius); padding: 18px 20px;

  position: relative; overflow: hidden;

}

.kpi-card::before {

  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;

  background: var(--kpi-color, var(--accent));

}

.kpi-label { font-size: 11.5px; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-bottom: 8px; }

.kpi-value { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums; }

.kpi-sub { font-size: 12px; color: var(--text3); }

 

/* Tables */

.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }

table { width: 100%; border-collapse: collapse; }

thead { background: var(--bg3); }

th {

  padding: 10px 14px; text-align: left; font-size: 11.5px;

  font-weight: 600; color: var(--text3); text-transform: uppercase;

  letter-spacing: .06em; white-space: nowrap; border-bottom: 1px solid var(--border);

}

td {

  padding: 11px 14px; font-size: 13.5px; color: var(--text2);

  border-bottom: 1px solid var(--border); vertical-align: middle;

}

tr:last-child td { border-bottom: none; }

tbody tr { transition: background var(--transition); }

tbody tr:hover { background: var(--bg3); }

.td-name { color: var(--text); font-weight: 500; }

.td-actions { display: flex; gap: 6px; align-items: center; }

 

/* Badges */

.badge {

  display: inline-flex; align-items: center; gap: 4px;

  padding: 3px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600;

  white-space: nowrap;

}

.badge-green { background: var(--green-bg); color: var(--green); }

.badge-yellow { background: var(--yellow-bg); color: var(--yellow); }

.badge-red { background: var(--red-bg); color: var(--red); }

.badge-blue { background: var(--accent-glow); color: var(--accent); }

.badge-purple { background: var(--purple-bg); color: var(--purple); }

.badge-gray { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

 

/* Risk bar */

.risk-bar-wrap { display: flex; align-items: center; gap: 8px; }

.risk-bar { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; min-width: 60px; }

.risk-bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }

.risk-score { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); min-width: 26px; text-align: right; }

 

/* Forms */

.form-grid { display: grid; gap: 14px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }

.form-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; }

.form-input, .form-select, .form-textarea {

  background: var(--bg3); border: 1px solid var(--border);

  color: var(--text); border-radius: var(--radius-sm);

  padding: 9px 12px; font-family: var(--font); font-size: 13.5px;

  transition: border-color var(--transition), box-shadow var(--transition);

  outline: none; width: 100%;

}

.form-input:focus, .form-select:focus, .form-textarea:focus {

  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);

}

.form-input::placeholder { color: var(--text3); }

.form-textarea { resize: vertical; min-height: 80px; }

.form-select option { background: var(--bg3); }

.form-hint { font-size: 11.5px; color: var(--text3); }

.form-error { font-size: 11.5px; color: var(--red); }

.range-wrap { display: flex; align-items: center; gap: 10px; }

input[type=range] { flex: 1; accent-color: var(--accent); }

 

/* Modal */

.modal-overlay {

  position: fixed; inset: 0; background: rgba(0,0,0,.7);

  display: flex; align-items: center; justify-content: center;

  z-index: 100; backdrop-filter: blur(4px); padding: 20px;

  animation: fadeIn .15s ease;

}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {

  background: var(--bg2); border: 1px solid var(--border2);

  border-radius: var(--radius); width: 100%; max-width: 560px;

  max-height: 90vh; display: flex; flex-direction: column;

  box-shadow: var(--shadow);

  animation: slideUp .2s ease;

}

@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-lg { max-width: 760px; }

.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

.modal-title { font-size: 15px; font-weight: 700; color: var(--text); }

.modal-close { width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--bg3); border: none; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; transition: all var(--transition); }

.modal-close:hover { background: var(--red-bg); color: var(--red); }

.modal-body { overflow-y: auto; padding: 22px; flex: 1; }

.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }

 

/* Toast */

#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }

.toast {

  display: flex; align-items: center; gap: 10px;

  padding: 12px 16px; border-radius: var(--radius-sm);

  background: var(--bg4); border: 1px solid var(--border2);

  box-shadow: var(--shadow); font-size: 13.5px; color: var(--text);

  animation: toastIn .25s ease; pointer-events: auto;

  max-width: 340px;

}

@keyframes toastIn { from { transform: translateX(32px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.toast-success .toast-icon { color: var(--green); }

.toast-error .toast-icon { color: var(--red); }

.toast-info .toast-icon { color: var(--accent); }

.toast-icon svg { width: 16px; height: 16px; }

 

/* Page headers */

.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }

.page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }

.page-desc { font-size: 13px; color: var(--text3); margin-top: 4px; }

.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

 

/* Filter bar */

.filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

.filter-bar .form-input { max-width: 220px; }

.filter-bar .form-select { max-width: 160px; }

 

/* Tabs */

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }

.tab-btn {

  padding: 10px 16px; font-size: 13.5px; font-weight: 500;

  color: var(--text3); cursor: pointer; border: none; background: none;

  border-bottom: 2px solid transparent; margin-bottom: -1px;

  transition: all var(--transition); font-family: var(--font);

}

.tab-btn:hover { color: var(--text2); }

.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

 

/* Kanban */

.kanban { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }

.kanban-col { min-width: 220px; width: 220px; flex-shrink: 0; }

.kanban-col-header {

  padding: 10px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;

  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;

  display: flex; align-items: center; justify-content: space-between;

}

.kanban-col-body { background: var(--bg3); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding: 8px; min-height: 80px; display: flex; flex-direction: column; gap: 8px; }

.kanban-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; transition: all var(--transition); }

.kanban-card:hover { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

.kanban-card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

.kanban-card-sub { font-size: 12px; color: var(--text3); }

 

/* Tags */

.tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {

  display: inline-flex; align-items: center; gap: 4px;

  padding: 3px 8px; background: var(--bg3); border: 1px solid var(--border);

  border-radius: 99px; font-size: 11.5px; color: var(--text3); font-weight: 500;

}

.tag-remove { cursor: pointer; opacity: .6; margin-left: 2px; }

.tag-remove:hover { opacity: 1; color: var(--red); }

.tag-input-wrap { display: flex; gap: 6px; }

.tag-input-wrap .form-input { flex: 1; }

 

/* Timeline */

.timeline { display: flex; flex-direction: column; gap: 0; }

.timeline-item { display: flex; gap: 14px; padding-bottom: 20px; position: relative; }

.timeline-item:last-child { padding-bottom: 0; }

.timeline-item::before {

  content: ''; position: absolute; left: 14px; top: 28px; bottom: 0; width: 1px;

  background: var(--border);

}

.timeline-item:last-child::before { display: none; }

.timeline-dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid; z-index: 1; }

.timeline-dot-pos { background: var(--green-bg); border-color: var(--green); color: var(--green); }

.timeline-dot-neg { background: var(--red-bg); border-color: var(--red); color: var(--red); }

.timeline-dot-neu { background: var(--bg3); border-color: var(--border2); color: var(--text3); }

.timeline-content { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }

.timeline-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }

.timeline-author { font-size: 12.5px; font-weight: 600; color: var(--text); }

.timeline-date { font-size: 11.5px; color: var(--text3); }

.timeline-text { font-size: 13.5px; color: var(--text2); line-height: 1.6; }

 

/* Score ring */

.score-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.score-ring { position: relative; width: 80px; height: 80px; }

.score-ring canvas { width: 80px !important; height: 80px !important; }

.score-ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }

 

/* Risk drivers */

.driver-list { display: flex; flex-direction: column; gap: 8px; }

.driver-item { display: flex; align-items: center; gap: 10px; }

.driver-name { font-size: 12.5px; color: var(--text2); flex: 1; }

.driver-bar-wrap { width: 100px; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }

.driver-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }

.driver-pts { font-size: 12px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; width: 30px; text-align: right; }

 

/* Alert items */

.alert-list { display: flex; flex-direction: column; gap: 10px; }

.alert-item { display: flex; gap: 12px; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); border-left: 3px solid var(--alert-color, var(--yellow)); }

.alert-item-icon { color: var(--alert-color, var(--yellow)); flex-shrink: 0; }

.alert-item-title { font-size: 13px; font-weight: 600; color: var(--text); }

.alert-item-desc { font-size: 12px; color: var(--text3); }

 

/* Correlations graph */

#corr-canvas-wrap { width: 100%; height: 380px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }

#corr-canvas { width: 100%; height: 100%; }

 

/* Print */

@media print {

  #sidebar, #topbar, #toast-container, .no-print { display: none !important; }

  #content { padding: 0 !important; }

  * { color: #000 !important; background: #fff !important; border-color: #ccc !important; }

}

#print-overlay { position: fixed; inset: 0; background: #fff; z-index: 200; overflow-y: auto; color: #111; padding: 40px; display: none; }

#print-overlay.visible { display: block; }

#print-overlay * { font-family: var(--font) !important; color: #111; }

 

/* Section header */

.section-header { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text3); margin-bottom: 12px; margin-top: 24px; }

.section-header:first-child { margin-top: 0; }

 

/* Grid layouts */

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }

 

/* Empty state */

.empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }

.empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }

.empty-state-text { font-size: 14px; }

 

/* Checkbox */

.check-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }

.check-wrap input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

 

/* Divider */

.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

 

/* Collapsible */

.collapsible-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }

.collapsible-icon { transition: transform var(--transition); }

.collapsible-icon.open { transform: rotate(180deg); }

</style>

</head>

  <!-- Sidebar -->

    <div class="sidebar-logo">

      <div class="logo-icon">P</div>

      <div>

        <div class="logo-text">PPM Suite</div>

        <div class="logo-sub">Suprimentos</div>

      </div>

    </div>

    <div class="nav-section">

      <div class="nav-label">Visão Geral</div>

      <a class="nav-item" data-route="dashboard" href="#">

        Dashboard

      </a>

    </div>

    <div class="nav-section">

      <div class="nav-label">Cadastros</div>

      <a class="nav-item" data-route="colaboradores" href="#">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

        Colaboradores

const STORAGE_KEY = 'ppm_app_v1';

 

const Storage = {

  get() {

      return raw ? JSON.parse(raw) : null;

    } catch { return null; }

  },

  save(data) {

    data.meta.lastUpdated = new Date().toISOString();

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  },

  backup() {

    const data = this.get();

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');

    a.href = url;

    a.download = `ppm_backup_${new Date().toISOString().slice(0,10)}.json`;

    a.click();

    URL.revokeObjectURL(url);

  },

  restore(data) {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  },

  reset() {

    localStorage.removeItem(STORAGE_KEY);

    initApp();

    Router.navigate('dashboard');

    toast('Dados reiniciados com sucesso', 'success');

  }

// ============================================================

// HELPERS

// ============================================================

function uid() {

  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

}

function esc(str) {

  if (!str) return '';

  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

}

function formatDate(iso) {

  if (!iso) return '—';

  const d = new Date(iso);

  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });

}

function daysAgo(iso) {

  if (!iso) return 9999;

  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);

}

function toast(msg, type = 'info') {

  const icons = {

    success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,

    error: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,

    info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`

  };

  const el = document.createElement('div');

  el.className = `toast toast-${type}`;

  el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${esc(msg)}</span>`;

  document.getElementById('toast-container').appendChild(el);

  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(32px)'; el.style.transition = '.3s ease'; setTimeout(() => el.remove(), 350); }, 3000);

}

function addAudit(data, acao, entidadeTipo, entidadeId, resumo) {

  if (!data.audit) data.audit = [];

  data.audit.unshift({ id: uid(), dataISO: new Date().toISOString(), usuario: 'usuario', acao, entidadeTipo, entidadeId, resumoMudanca: resumo });

  if (data.audit.length > 200) data.audit = data.audit.slice(0, 200);

}

function getNomeColaborador(data, id) {

  const c = data.colaboradores.find(x => x.id === id);

  return c ? c.nome : '—';

}

function getNomeArea(data, id) {

  const a = data.areas.find(x => x.id === id);

  return a ? a.nome : '—';

}

function riskColor(score) {

  if (score >= 60) return 'var(--red)';

  if (score >= 30) return 'var(--yellow)';

  return 'var(--green)';

}

function riskBadge(score) {

  if (score >= 60) return '<span class="badge badge-red">Alto</span>';

  if (score >= 30) return '<span class="badge badge-yellow">Médio</span>';

  return '<span class="badge badge-green">Baixo</span>';

}

function seniorBadge(s) {

  const map = { Jr: 'badge-gray', Pl: 'badge-blue', Sr: 'badge-purple', Coord: 'badge-yellow', Ger: 'badge-red' };

  return `<span class="badge ${map[s] || 'badge-gray'}">${esc(s)}</span>`;

}

function statusBadge(s) {

  if (s === 'ativo') return '<span class="badge badge-green">Ativo</span>';

  return '<span class="badge badge-gray">Inativo</span>';

}

 

// ============================================================

// RISK ENGINE

// ============================================================

const RiskEngine = {

  calculate(data, colaborador) {

    const weights = data.settings?.weights || { criticidade: 30, sucessao: 25, obsNegativas: 20, vagaCritica: 10, sinalizacao: 20, desatualizado: 10 };

    const drivers = [];

    let score = 0;

 

    // 1. Criticidade do papel

    const funcao = data.funcoesCriticas.find(f => f.colaboradorAtualId === colaborador.id);

    if (funcao) {

      const pts = Math.round((funcao.criticidade / 5) * weights.criticidade);

      score += pts;

      drivers.push({ nome: 'Criticidade do papel', pts, max: weights.criticidade, detalhe: `Função crítica: ${funcao.nomeFuncao} (${funcao.criticidade}/5)` });

    } else {

      drivers.push({ nome: 'Criticidade do papel', pts: 0, max: weights.criticidade, detalhe: 'Não vinculado a função crítica' });

    }

 

    // 2. Sucessão

    const suc = data.sucessoes.find(s => s.colaboradorAtualId === colaborador.id);

    let sucPts = 0;

    let sucDetalhe = 'Sem plano de sucessão';

    if (suc) {

      const map = { 'Sem sucessor': 1, '12-24m': 0.8, '6-12m': 0.5, 'Ready now': 0.1 };

      sucPts = Math.round((map[suc.prontidao] || 0) * weights.sucessao);

      sucDetalhe = `Prontidão: ${suc.prontidao}`;

    } else {

      sucPts = Math.round(weights.sucessao * 0.6);

    }

    score += sucPts;

    drivers.push({ nome: 'Ausência de sucessor', pts: sucPts, max: weights.sucessao, detalhe: sucDetalhe });

 

    // 3. Observações negativas (últimos 90 dias)

    const negObs = data.observacoes.filter(o => o.entidadeId === colaborador.id && o.tom === 'negativo' && daysAgo(o.dataISO) <= 90);

    const obsPts = Math.min(negObs.length * Math.round(weights.obsNegativas / 3), weights.obsNegativas);

    score += obsPts;

    drivers.push({ nome: 'Obs. negativas (90d)', pts: obsPts, max: weights.obsNegativas, detalhe: `${negObs.length} observação(ões) negativa(s)` });

 

    // 4. Vaga crítica aberta na área

    const vagaCrit = data.vagas.find(v => v.areaId === colaborador.areaId && (v.criticidade >= 4) && ['Aberta', 'Em entrevista'].includes(v.status));

    const vagaPts = vagaCrit ? weights.vagaCritica : 0;

    score += vagaPts;

    drivers.push({ nome: 'Vaga crítica na área', pts: vagaPts, max: weights.vagaCritica, detalhe: vagaCrit ? `Vaga: ${vagaCrit.funcaoTexto}` : 'Nenhuma vaga crítica aberta' });

 

    // 5. Sinalização do gestor

    const sinMap = { 0: 0, 1: 5, 2: 12, 3: weights.sinalizacao };

    const sinPts = sinMap[colaborador.sinalizacaoGestor] || 0;

    score += sinPts;

    drivers.push({ nome: 'Sinalização do gestor', pts: sinPts, max: weights.sinalizacao, detalhe: `Nível: ${colaborador.sinalizacaoGestor}/3` });

 

    // 6. Dados desatualizados

    const lastObs = data.observacoes.filter(o => o.entidadeId === colaborador.id).sort((a, b) => new Date(b.dataISO) - new Date(a.dataISO))[0];

    const desatPts = (!lastObs || daysAgo(lastObs.dataISO) > 120) ? weights.desatualizado : 0;

    score += desatPts;

    drivers.push({ nome: 'Dados desatualizados', pts: desatPts, max: weights.desatualizado, detalhe: lastObs ? `Última obs: ${daysAgo(lastObs.dataISO)} dias` : 'Sem observações' });

 

    const maxPossible = weights.criticidade + weights.sucessao + weights.obsNegativas + weights.vagaCritica + weights.sinalizacao + weights.desatualizado;

    const normalized = Math.min(Math.round((score / maxPossible) * 100), 100);

    return { score: normalized, rawScore: score, drivers };

  },

 

  allScores(data) {

    return data.colaboradores.filter(c => c.status === 'ativo').map(c => ({

      colaborador: c,

      ...this.calculate(data, c)

    })).sort((a, b) => b.score - a.score);

  }

};

    switch (route) {

      case 'colaboradores': params.id ? renderColaboradorPerfil(data, params.id) : renderColaboradores(data); break;

      case 'funcoes': renderFuncoes(data); break;

      case 'observacoes': renderObservacoes(data, params); break;

      default: renderDashboard(data);

// MODAL SYSTEM

// ============================================================

let modalStack = [];

function openModal(html, options = {}) {

  const overlay = document.createElement('div');

  overlay.className = 'modal-overlay';

  overlay.innerHTML = `<div class="modal ${options.lg ? 'modal-lg' : ''}" role="dialog" aria-modal="true">${html}</div>`;

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.body.appendChild(overlay);

  modalStack.push(overlay);

  const first = overlay.querySelector('input, select, textarea, button');

  if (first) setTimeout(() => first.focus(), 50);

}

function closeModal() {

  const m = modalStack.pop();

  if (m) m.remove();

}

function closeAllModals() {

  modalStack.forEach(m => m.remove());

  modalStack = [];

}

// EXPORT / IMPORT

// ============================================================

function exportData() {

  Storage.backup();

  toast('Exportação concluída', 'success');

}

function importData(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    try {

      const imported = JSON.parse(e.target.result);

      if (!imported.meta || !imported.colaboradores) throw new Error('Estrutura inválida');

      openModal(`

        <div class="modal-header"><span class="modal-title">Importar Dados</span><button class="modal-close" onclick="closeModal()">✕</button></div>

        <div class="modal-body">

          <p style="color:var(--text2);margin-bottom:16px;">Arquivo: <strong>${esc(file.name)}</strong></p>

          <p style="color:var(--text2);">Versão: <strong>${esc(imported.meta?.version)}</strong> · ${(imported.colaboradores||[]).length} colaboradores</p>

          <p style="color:var(--yellow);margin-top:12px;font-size:13px;">⚠️ Isso substituirá todos os dados atuais.</p>

        </div>

        <div class="modal-footer">

          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>

          <button class="btn btn-primary" onclick="confirmImport(${JSON.stringify(imported).replace(/"/g,'&quot;')})">Substituir e Importar</button>

        </div>

      `);

    } catch (err) {

      toast('Arquivo inválido: ' + err.message, 'error');

    }

  };

  reader.readAsText(file);

  event.target.value = '';

}

function confirmImport(data) {

  if (typeof data === 'string') { try { data = JSON.parse(data); } catch {} }

  addAudit(data, 'import', 'meta', 'all', 'Importação total de dados');

  Storage.restore(data);

  closeAllModals();

  Router.navigate(currentRoute);

  toast('Dados importados com sucesso', 'success');

}

              <option value="2" ${c?.sinalizacaoGestor===2?'selected':''}>2 – Moderada</option>

function saveColaborador(id) {

  const nome = document.getElementById('col-nome').value.trim();

  const email = document.getElementById('col-email').value.trim();

  const cargo = document.getElementById('col-cargo').value.trim();

  if (!nome || !email || !cargo) { toast('Preencha os campos obrigatórios', 'error'); return; }

  if (!/\S+@\S+\.\S+/.test(email)) { toast('E-mail inválido', 'error'); return; }

  const data = Storage.get();

  const obj = {

    id: id || uid(), nome, email, cargo,

    matricula: document.getElementById('col-mat').value.trim(),

    senioridade: document.getElementById('col-sen').value,

    areaId: document.getElementById('col-area').value,

    localidade: document.getElementById('col-local').value.trim(),

    gestor: document.getElementById('col-gestor').value.trim(),

    status: document.getElementById('col-status').value,

    sinalizacaoGestor: parseInt(document.getElementById('col-sig').value),

    retencaoObservada: 1

  };

  if (id) {

    const i = data.colaboradores.findIndex(x => x.id === id);

    if (i >= 0) { Object.assign(data.colaboradores[i], obj); }

    addAudit(data, 'update', 'Colaborador', id, `Editou: ${nome}`);

  } else {

    data.colaboradores.push(obj);

    addAudit(data, 'create', 'Colaborador', obj.id, `Criou: ${nome}`);

  }

  Storage.save(data);

  closeModal();

  renderColaboradores(data);

  toast(id ? 'Colaborador atualizado' : 'Colaborador criado', 'success');

}

function deleteColaborador(id) {

  const data = Storage.get();

  const c = data.colaboradores.find(x => x.id === id);

  if (!confirm(`Excluir colaborador "${c?.nome}"? Esta ação não pode ser desfeita.`)) return;

  data.colaboradores = data.colaboradores.filter(x => x.id !== id);

  addAudit(data, 'delete', 'Colaborador', id, `Excluiu: ${c?.nome}`);

  Storage.save(data);

  renderColaboradores(data);

  toast('Colaborador excluído', 'info');

}

function filterFuncoes() {

  const data = Storage.get();

  const q = document.getElementById('funcSearch')?.value.toLowerCase() || '';

  const area = document.getElementById('funcAreaFilter')?.value || '';

  if (q) funcs = funcs.filter(f => f.nomeFuncao.toLowerCase().includes(q));

  if (area) funcs = funcs.filter(f => f.areaId === area);

  document.getElementById('funcTbody').innerHTML = renderFuncoesRows(data, funcs);

function renderObsRows(data, obs) {

  const tomMap = { positivo: 'badge-green', neutro: 'badge-gray', negativo: 'badge-red' };

 if (!obs.length) return '<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">Nenhuma observação</div></div>';

  return `<div class="timeline">${obs.sort((a,b) => new Date(b.dataISO)-new Date(a.dataISO)).map(o => {

    const nome = o.tipoEntidade === 'Colaborador' ? getNomeColaborador(data, o.entidadeId) : o.tipoEntidade + ' · ' + (o.entidadeId||'').slice(0,6);

    return `

      <div class="timeline-item">

        <div class="timeline-dot timeline-dot-${o.tom}">${o.tom==='positivo'?'↑':o.tom==='negativo'?'↓':'·'}</div>

        <div class="timeline-content">

          <div class="timeline-meta">

            <span class="timeline-author">${esc(nome)}</span>

            <span class="badge badge-gray" style="font-size:10px;">${esc(o.tipoEntidade)}</span>

            <span class="badge ${tomMap[o.tom]}">${o.tom}</span>

            ${o.confidencial ? '<span class="badge badge-red" style="font-size:10px;">🔒 Conf.</span>' : ''}

            <span class="timeline-date">${formatDate(o.dataISO)}</span>

          </div>

          <div class="timeline-text">${esc(o.texto)}</div>

          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">

            ${o.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}

          </div>

          <div style="margin-top:8px;display:flex;gap:6px;">

            <span style="font-size:11.5px;color:var(--text3);">Por: ${esc(o.autor)}</span>

            <button class="btn btn-ghost btn-xs" onclick="openObsForm('${o.tipoEntidade}','${o.entidadeId}','${o.id}')">Editar</button>

            <button class="btn btn-danger btn-xs" onclick="deleteObs('${o.id}')">Excluir</button>

          </div>

        </div>

      </div>

    `;

  }).join('')}</div>`;

}

function filterObs() {

  const data = Storage.get();

  const q = document.getElementById('obsTxt')?.value.toLowerCase() || '';

  const tipo = document.getElementById('obsTipo')?.value || '';

  const tom = document.getElementById('obsTom')?.value || '';

  const conf = document.getElementById('obsConf')?.checked || false;

  let obs = data.observacoes;

  if (q) obs = obs.filter(o => o.texto.toLowerCase().includes(q) || o.tags.some(t => t.toLowerCase().includes(q)));

  if (tipo) obs = obs.filter(o => o.tipoEntidade === tipo);

  if (tom) obs = obs.filter(o => o.tom === tom);

  if (!conf) obs = obs.filter(o => !o.confidencial);

  document.getElementById('obs-list').innerHTML = renderObsRows(data, obs);

}

function renderObsEntidadeOpts(data, tipo, selectedId) {

  let list = [];

  if (tipo === 'Colaborador') list = data.colaboradores.map(c => ({ id: c.id, nome: c.nome }));

  else if (tipo === 'FuncaoCritica') list = data.funcoesCriticas.map(f => ({ id: f.id, nome: f.nomeFuncao }));

  else if (tipo === 'Vaga') list = data.vagas.map(v => ({ id: v.id, nome: v.funcaoTexto }));

  else if (tipo === 'Sucessao') list = data.sucessoes.map(s => ({ id: s.id, nome: getNomeColaborador(data, s.colaboradorAtualId) + ' → ' + (s.sucessorId ? getNomeColaborador(data, s.sucessorId) : 'Sem') }));

  return list.map(x => `<option value="${x.id}" ${x.id===selectedId?'selected':''}>${esc(x.nome)}</option>`).join('');

}

function updateObsEntidade() {

  const data = Storage.get();

  const tipo = document.getElementById('o-tipo').value;

  document.getElementById('o-entid').innerHTML = renderObsEntidadeOpts(data, tipo, '');

}

function saveObs(id) {

  const texto = document.getElementById('o-texto').value.trim();

  if (!texto) { toast('Informe o texto', 'error'); return; }

  const data = Storage.get();

  const tagsRaw = document.getElementById('o-tags').value;

  const obj = {

    id: id || uid(),

    tipoEntidade: document.getElementById('o-tipo').value,

    entidadeId: document.getElementById('o-entid').value,

    dataISO: id ? (data.observacoes.find(x=>x.id===id)?.dataISO || new Date().toISOString()) : new Date().toISOString(),

    autor: document.getElementById('o-autor').value.trim() || 'usuário',

    texto,

    tags: tagsRaw.split(',').map(t => t.trim()).filter(Boolean),

    confidencial: document.getElementById('o-conf').checked,

    tom: document.getElementById('o-tom').value,

  };

  if (id) { const i = data.observacoes.findIndex(x=>x.id===id); if (i>=0) Object.assign(data.observacoes[i], obj); addAudit(data,'update','Observacao',id,'Editou observação'); }

  else { data.observacoes.push(obj); addAudit(data,'create','Observacao',obj.id,'Criou observação'); }

  Storage.save(data); closeModal();

  if (currentRoute === 'observacoes') renderObservacoes(data);

  else if (currentRoute === 'colaboradores') { const data2 = Storage.get(); renderColaboradorPerfil(data2, obj.entidadeId); }

  toast('Observação salva', 'success');

}

function deleteObs(id) {

  const data = Storage.get();

  if (!confirm('Excluir observação?')) return;

  data.observacoes = data.observacoes.filter(x => x.id !== id);

  addAudit(data,'delete','Observacao',id,'Excluiu observação');

  Storage.save(data);

  if (currentRoute === 'observacoes') renderObservacoes(data);

  toast('Observação excluída', 'info');

}

      <div class="page-actions"><button class="btn btn-primary" onclick="openCorrForm()">+ Nova Correlação</button></div>

    </div>

    <div id="corr-canvas-wrap" style="margin-bottom:20px;">

      <canvas id="corr-canvas"></canvas>

    </div>

    <div class="filter-bar">

      <select class="form-select" id="corr-tipo-filter" onchange="filterCorr()">

        <option value="">Todos os tipos</option>

        ${['DependeDe','Back-up','Mentoria','Impacta','Risco'].map(t=>`<option value="${t}">${t}</option>`).join('')}

      </select>

    </div>

    <div class="table-wrap">

      <table>

        <thead><tr><th>Origem</th><th>Destino</th><th>Relação</th><th>Nota</th><th>Ações</th></tr></thead>

        <tbody id="corr-tbody">${renderCorrRows(data, data.correlacoes)}</tbody>

      </table>

    </div>

  `;

  document.getElementById('content').innerHTML = html;

  drawCorrGraph(data);

}

function renderCorrRows(data, corrs) {

  const tipoMap = { DependeDe:'badge-red', 'Back-up':'badge-green', Mentoria:'badge-blue', Impacta:'badge-yellow', Risco:'badge-red' };

  if (!corrs.length) return '<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">🔗</div><div class="empty-state-text">Nenhuma correlação</div></div></td></tr>';

  return corrs.map(cr => {

    const oNome = cr.origemTipo === 'Colaborador' ? getNomeColaborador(data, cr.origemId) : cr.origemTipo + ' ' + cr.origemId.slice(0,6);

    const dNome = cr.destinoTipo === 'Colaborador' ? getNomeColaborador(data, cr.destinoId) : cr.destinoTipo + ' ' + cr.destinoId.slice(0,6);

    return `

      <tr>

        <td><span class="badge badge-gray" style="font-size:10px;">${esc(cr.origemTipo)}</span> ${esc(oNome)}</td>

        <td><span class="badge badge-gray" style="font-size:10px;">${esc(cr.destinoTipo)}</span> ${esc(dNome)}</td>

        <td><span class="badge ${tipoMap[cr.tipoRelacao]||'badge-gray'}">${esc(cr.tipoRelacao)}</span></td>

        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(cr.nota)}</td>

        <td class="td-actions"><button class="btn btn-danger btn-xs" onclick="deleteCorr('${cr.id}')">✕</button></td>

      </tr>

    `;

  }).join('');

}

function filterCorr() {

  const data = Storage.get();

  const tipo = document.getElementById('corr-tipo-filter')?.value || '';

  let corrs = data.correlacoes;

  if (tipo) corrs = corrs.filter(c => c.tipoRelacao === tipo);

function drawCorrGraph(data) {

  const canvas = document.getElementById('corr-canvas');

  if (!canvas) return;

  const wrap = document.getElementById('corr-canvas-wrap');

  canvas.width = wrap.offsetWidth || 700;

  canvas.height = 380;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

 

  // Build nodes

  const nodeMap = {};

  data.correlacoes.forEach(cr => {

    if (!nodeMap[cr.origemId]) nodeMap[cr.origemId] = { id: cr.origemId, tipo: cr.origemTipo, label: cr.origemTipo === 'Colaborador' ? getNomeColaborador(data, cr.origemId).split(' ')[0] : cr.origemTipo.slice(0,4) };

    if (!nodeMap[cr.destinoId]) nodeMap[cr.destinoId] = { id: cr.destinoId, tipo: cr.destinoTipo, label: cr.destinoTipo === 'Colaborador' ? getNomeColaborador(data, cr.destinoId).split(' ')[0] : cr.destinoTipo.slice(0,4) };

  });

  const nodes = Object.values(nodeMap);

  const W = canvas.width, H = canvas.height;

  // Place in circle

  nodes.forEach((n, i) => {

    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;

    n.x = W/2 + Math.cos(angle) * (Math.min(W,H) * 0.35);

    n.y = H/2 + Math.sin(angle) * (Math.min(W,H) * 0.35);

  });

 

  const relColors = { DependeDe:'#ef4444', 'Back-up':'#22c55e', Mentoria:'#3b82f6', Impacta:'#f59e0b', Risco:'#ef4444' };

 

  // Draw edges

  data.correlacoes.forEach(cr => {

    const o = nodeMap[cr.origemId], d = nodeMap[cr.destinoId];

    if (!o || !d) return;

    ctx.beginPath();

    ctx.moveTo(o.x, o.y);

    ctx.lineTo(d.x, d.y);

    ctx.strokeStyle = relColors[cr.tipoRelacao] || '#3b82f6';

    ctx.lineWidth = 1.5;

    ctx.globalAlpha = 0.6;

    ctx.stroke();

    ctx.globalAlpha = 1;

    // Arrow

    const angle = Math.atan2(d.y - o.y, d.x - o.x);

    const mx = (o.x + d.x) / 2, my = (o.y + d.y) / 2;

    ctx.beginPath();

    ctx.moveTo(mx, my);

    ctx.lineTo(mx - 10 * Math.cos(angle - 0.4), my - 10 * Math.sin(angle - 0.4));

    ctx.lineTo(mx - 10 * Math.cos(angle + 0.4), my - 10 * Math.sin(angle + 0.4));

    ctx.closePath();

    ctx.fillStyle = relColors[cr.tipoRelacao] || '#3b82f6';

    ctx.fill();

  });

 

  // Draw nodes

  nodes.forEach(n => {

    const col = n.tipo === 'Colaborador' ? '#3b82f6' : n.tipo === 'FuncaoCritica' ? '#a78bfa' : '#f59e0b';

    ctx.beginPath();

    ctx.arc(n.x, n.y, 22, 0, Math.PI * 2);

    ctx.fillStyle = col + '22';

    ctx.fill();

    ctx.strokeStyle = col;

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.fillStyle = '#e8ecf4';

    ctx.font = '600 11px DM Sans, sans-serif';

    ctx.textAlign = 'center';

    ctx.textBaseline = 'middle';

    ctx.fillText(n.label.slice(0,8), n.x, n.y);

  });

}

function addArea() {

  const val = document.getElementById('new-area').value.trim();

  const data = Storage.get();

  data.areas.push({ id: uid(), nome: val });

  Storage.save(data); renderConfig(data); toast('Área adicionada', 'success');

function editArea(id) {

  const data = Storage.get();

  const a = data.areas.find(x => x.id === id);

  const nome = prompt('Novo nome da área:', a?.nome || '');

  if (!nome) return;

  const i = data.areas.findIndex(x => x.id === id);

  if (i >= 0) data.areas[i].nome = nome;

  addAudit(data,'update','Area',id,'Renomeou área');

  Storage.save(data); renderConfig(data); toast('Área atualizada', 'success');

}

function deleteArea(id) {
